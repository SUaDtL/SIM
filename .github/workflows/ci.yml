name: ci

# The full gate (typecheck, lint, format, build, unit tests, offline e2e in Edge and Chrome) on
# every push to main and every pull request. The release workflow publishes only a main commit
# whose push run here succeeded.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows runners ship both Microsoft Edge and Google Chrome, the e2e browsers.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0

      - run: npm ci
      - run: npm run check
